server:
  port: 8089

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/auth/**

        - id: api-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/**

        - id: webhook-route
          uri: http://localhost:8082
          predicates:
            - Path=/webhook/**

jwt:
  secret: my-secret-key-change-this

webhook:
  secret: my-webhook-secret
